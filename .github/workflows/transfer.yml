name: GDrive to Gofile
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive File ID"
        required: true
      filename:
        description: "Output filename"
        required: false
        default: "Realzeal_1116.mp4"
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install gdown
        run: pip install -q gdown
      - name: Download from Google Drive
        run: |
          echo "Start download: $(date)"
          timeout 240 gdown "${{ github.event.inputs.file_id }}" -O "${{ github.event.inputs.filename }}"
          ls -lh "${{ github.event.inputs.filename }}"
          echo "End download: $(date)"
      - name: Upload to Gofile
        run: |
          echo "Start upload: $(date)"
          RESP=$(curl -sS --max-time 300 -F "file=@${{ github.event.inputs.filename }}" "https://upload.gofile.io/uploadfile")
          echo "$RESP"
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          echo "=========================================="
          echo "GOFILE LINK: $LINK"
          echo "=========================================="
